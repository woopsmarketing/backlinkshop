<svg viewBox="0 0 800 450" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>여러 네트워크 사이트가 하나의 목표 사이트로 링크를 보내는 PBN 구조 개념도</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1.5 L9,5 L0,8.5 Z" fill="#3157e8"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="#ffffff"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="48" y="46" font-size="20" font-weight="600" fill="#111111">PBN은 어떻게 구성되는가</text>
    <text x="48" y="70" font-size="14" fill="#5f636b">독립된 여러 사이트가 하나의 목표 사이트로 링크를 보내는 구조입니다</text>
    <text x="48" y="106" font-size="13" fill="#8b9098">네트워크 사이트 · 각각 도메인 이력과 주제, 호스팅이 다름</text>

    <g fill="none" stroke="#b7c4f7" stroke-width="1.5" marker-end="url(#ar)">
      <path d="M112,192 C112,246 340,272 340,326"/>
      <path d="M256,192 C256,246 370,272 370,326"/>
      <path d="M400,192 L400,326"/>
      <path d="M544,192 C544,246 430,272 430,326"/>
      <path d="M688,192 C688,246 460,272 460,326"/>
    </g>

    <g>
      <rect x="48" y="120" width="128" height="72" rx="12" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1.25"/>
      <text x="112" y="150" font-size="14" fill="#111111" text-anchor="middle">네트워크</text>
      <text x="112" y="170" font-size="14" fill="#111111" text-anchor="middle">사이트</text>

      <rect x="192" y="120" width="128" height="72" rx="12" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1.25"/>
      <text x="256" y="150" font-size="14" fill="#111111" text-anchor="middle">네트워크</text>
      <text x="256" y="170" font-size="14" fill="#111111" text-anchor="middle">사이트</text>

      <rect x="336" y="120" width="128" height="72" rx="12" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1.25"/>
      <text x="400" y="150" font-size="14" fill="#111111" text-anchor="middle">네트워크</text>
      <text x="400" y="170" font-size="14" fill="#111111" text-anchor="middle">사이트</text>

      <rect x="480" y="120" width="128" height="72" rx="12" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1.25"/>
      <text x="544" y="150" font-size="14" fill="#111111" text-anchor="middle">네트워크</text>
      <text x="544" y="170" font-size="14" fill="#111111" text-anchor="middle">사이트</text>

      <rect x="624" y="120" width="128" height="72" rx="12" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1.25"/>
      <text x="688" y="150" font-size="14" fill="#111111" text-anchor="middle">네트워크</text>
      <text x="688" y="170" font-size="14" fill="#111111" text-anchor="middle">사이트</text>
    </g>

    <rect x="290" y="330" width="220" height="76" rx="12" fill="#eef2ff" stroke="#3157e8" stroke-width="2"/>
    <text x="400" y="364" font-size="20" font-weight="600" fill="#1f3bb3" text-anchor="middle">목표 사이트</text>
    <text x="400" y="388" font-size="13" fill="#5f636b" text-anchor="middle">링크를 받는 쪽</text>

    <text x="400" y="432" font-size="13" fill="#8b9098" text-anchor="middle">구조를 이해하기 위한 개념도입니다</text>
  </g>
</svg>
