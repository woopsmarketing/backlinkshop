<svg viewBox="0 0 800 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>업체가 흔히 하는 네 가지 말과 그 말이 실제로 뜻하는 바를 짝지은 표</title>
  <defs>
    <marker id="arm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1.5 L9,5 L0,8.5 Z" fill="#8b9098"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="48" y="36" font-size="20" font-weight="600" fill="#111111">설명하지 않는 업체의 신호</text>
    <text x="48" y="58" font-size="14" fill="#5f636b">말 자체보다, 그 말을 뒷받침하는 설명이 있는지를 봅니다</text>

    <text x="48" y="94" font-size="13" fill="#8b9098">이렇게 말한다면</text>
    <text x="452" y="94" font-size="13" fill="#8b9098">실제로는</text>

    <g fill="none" stroke="#d8dde6" stroke-width="1.5" marker-end="url(#arm)">
      <path d="M386,128 L444,128"/>
      <path d="M386,193 L444,193"/>
      <path d="M386,258 L444,258"/>
      <path d="M386,323 L444,323"/>
    </g>

    <g>
      <rect x="48" y="102" width="330" height="52" rx="10" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1.25"/>
      <text x="70" y="133" font-size="14" fill="#111111">“100% 안전합니다”</text>
      <rect x="452" y="102" width="300" height="52" rx="10" fill="#ffffff" stroke="#d8dde6" stroke-width="1.25"/>
      <circle cx="474" cy="128" r="4" fill="#b4530a"/>
      <text x="490" y="133" font-size="14" fill="#111111">리스크를 설명하지 않는 것</text>

      <rect x="48" y="167" width="330" height="52" rx="10" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1.25"/>
      <text x="70" y="198" font-size="14" fill="#111111">“구글 알고리즘을 압니다”</text>
      <rect x="452" y="167" width="300" height="52" rx="10" fill="#ffffff" stroke="#d8dde6" stroke-width="1.25"/>
      <circle cx="474" cy="193" r="4" fill="#b4530a"/>
      <text x="490" y="198" font-size="14" fill="#111111">확인할 수 없는 주장</text>

      <rect x="48" y="232" width="330" height="52" rx="10" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1.25"/>
      <text x="70" y="263" font-size="14" fill="#111111">“순위를 보장합니다”</text>
      <rect x="452" y="232" width="300" height="52" rx="10" fill="#ffffff" stroke="#d8dde6" stroke-width="1.25"/>
      <circle cx="474" cy="258" r="4" fill="#b4530a"/>
      <text x="490" y="263" font-size="14" fill="#111111">통제할 수 없는 약속</text>

      <rect x="48" y="297" width="330" height="52" rx="10" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1.25"/>
      <text x="70" y="328" font-size="14" fill="#111111">“링크는 넣으면 됩니다”</text>
      <rect x="452" y="297" width="300" height="52" rx="10" fill="#ffffff" stroke="#d8dde6" stroke-width="1.25"/>
      <circle cx="474" cy="323" r="4" fill="#b4530a"/>
      <text x="490" y="328" font-size="14" fill="#111111">앵커와 유형 계획이 없는 것</text>
    </g>

    <text x="48" y="381" font-size="13" fill="#8b9098">설명할 수 없는 약속은, 대개 근거가 없기 때문입니다.</text>
  </g>
</svg>
