<svg viewBox="0 0 800 400" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>키워드 경쟁도에 따라 링크 품질과 범위 중 무엇을 먼저 둘지 정하는 예산 결정 흐름</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,1.5 L9,5 L0,8.5 Z" fill="#3157e8"/>
    </marker>
  </defs>
  <rect width="800" height="400" fill="#ffffff"/>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="48" y="36" font-size="20" font-weight="600" fill="#111111">예산을 정하는 순서</text>
    <text x="48" y="58" font-size="14" fill="#5f636b">경쟁도에 따라 무엇을 먼저 살지가 달라집니다</text>

    <g fill="none" stroke="#b7c4f7" stroke-width="1.5" marker-end="url(#ar)">
      <path d="M206,196 L242,196"/>
      <path d="M358,196 C386,196 388,114 420,114"/>
      <path d="M358,196 C386,196 388,278 420,278"/>
      <path d="M572,114 C596,114 596,196 616,196"/>
      <path d="M572,278 C596,278 596,196 616,196"/>
    </g>

    <rect x="48" y="160" width="158" height="72" rx="12" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1.25"/>
    <text x="127" y="189" font-size="15" fill="#111111" text-anchor="middle">목표 키워드</text>
    <text x="127" y="211" font-size="15" fill="#111111" text-anchor="middle">경쟁도 확인</text>

    <polygon points="300,146 358,196 300,246 242,196" fill="#ffffff" stroke="#3157e8" stroke-width="2" stroke-linejoin="round"/>
    <text x="300" y="201" font-size="15" font-weight="600" fill="#1f3bb3" text-anchor="middle">경쟁도</text>

    <rect x="364" y="142" width="52" height="24" rx="12" fill="#ffffff" stroke="#d8dde6" stroke-width="1.25"/>
    <text x="390" y="158" font-size="13" fill="#5f636b" text-anchor="middle">높음</text>
    <rect x="364" y="226" width="52" height="24" rx="12" fill="#ffffff" stroke="#d8dde6" stroke-width="1.25"/>
    <text x="390" y="242" font-size="13" fill="#5f636b" text-anchor="middle">보통</text>

    <rect x="420" y="78" width="152" height="72" rx="12" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1.25"/>
    <text x="496" y="106" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">링크 품질 우선</text>
    <text x="496" y="128" font-size="13" fill="#5f636b" text-anchor="middle">적은 수, 높은 기준</text>

    <rect x="420" y="242" width="152" height="72" rx="12" fill="#f7f9fc" stroke="#d8dde6" stroke-width="1.25"/>
    <text x="496" y="270" font-size="15" font-weight="600" fill="#111111" text-anchor="middle">범위 우선</text>
    <text x="496" y="292" font-size="13" fill="#5f636b" text-anchor="middle">여러 페이지 커버</text>

    <rect x="616" y="160" width="136" height="72" rx="12" fill="#eef2ff" stroke="#3157e8" stroke-width="2"/>
    <text x="684" y="192" font-size="15" font-weight="600" fill="#1f3bb3" text-anchor="middle">우선순위 구성</text>
    <text x="684" y="214" font-size="13" fill="#5f636b" text-anchor="middle">예산 배분 기준</text>

    <text x="48" y="366" font-size="13" fill="#8b9098">경쟁도가 높을수록 링크 수보다 품질 기준이 먼저입니다.</text>
  </g>
</svg>
